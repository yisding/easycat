[project]
name = "easycat"
version = "0.1.0"
description = "Slim, batteries-included voice bot framework for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EasyCat contributors" }]
license = "BSD-2-Clause"
license-files = ["LICENSE"]
keywords = [
    "agent-framework",
    "speech-to-text",
    "telephony",
    "text-to-speech",
    "voice-agents",
    "webrtc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.8",
    "sentencesplit>=0.1.0",
    "soxr>=1.0.0",
    "typing-extensions>=4.16.0",
    "typer>=0.26",
    "websockets>=14.0,<17",
]

[project.scripts]
easycat = "easycat.cli:main"

[project.urls]
Documentation = "https://yisding.github.io/easycat/"
Issues = "https://github.com/yisding/easycat/issues"
Repository = "https://github.com/yisding/easycat"

[project.entry-points.pytest11]
easycat = "easycat.debug._pytest_plugin"

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.18.3"]
# Compatibility schedule: retain the PydanticAI v1 extra through 2027-07-31.
# In the next breaking EasyCat release after that date, ``pydantic-ai`` can
# move to the supported 2.x range, the transitional ``pydantic-ai-v2`` alias
# can be removed, and the [tool.uv].conflicts entry below can be collapsed.
pydantic-ai = ["pydantic-ai>=1.99.0,<2.0.0"]
pydantic-ai-v2 = ["pydantic-ai>=2.5.1,<3.0.0"]
# Security floor: 1.2.28 includes the LangChain prompt-validation fixes from
# GHSA-c67j-w6g6-q2cm, GHSA-qh6h-p6c9-ff54, and GHSA-926x-3r5x-gfhw.
langchain = ["langchain-core>=1.2.28"]
langgraph = ["langchain-core>=1.2.28", "langgraph>=1.2.9"]
llama-agents = ["llama-index-workflows>=2.22.2,<3.0.0", "llama-agents-client>=0.3.11,<1.0.0"]
openai = ["openai>=2.44.0"]
# Deepgram, ElevenLabs, and Cartesia STT/TTS talk directly to their
# provider WebSocket/HTTP APIs via the core ``websockets`` / ``httpx``
# dependencies — no vendor SDK install is required. These marker extras
# exist so downstream tooling (e.g. ``easycat doctor``) can enumerate
# the provider surface uniformly with the other ``[stt]`` / ``[tts]``
# extras.
deepgram = []
elevenlabs = []
cartesia = []
telephony = [
    # 3.13.3 fixes the request parsing and resource-exhaustion advisories
    # published for every aiohttp release through 3.13.2.
    "aiohttp>=3.13.3",
    "phonenumberslite>=9.0.35",
    "twilio>=9.0.0",
]
# The bundled lower-level reference app and twilio-phone scaffold use FastAPI
# and uvicorn; the reusable telephony library itself does not. FastAPI form
# handling also requires python-multipart for Twilio webhook endpoints.
telephony-fastapi = [
    "fastapi>=0.140.0",
    "python-multipart>=0.0.29",
    "uvicorn>=0.51.0",
]
aec = ["livekit>=1.1.13"]
local = ["sounddevice>=0.4.6", "numpy>=1.24.0"]
rnnoise = ["pyrnnoise>=0.3.0", "requests>=2.33.0"]
# TEN VAD has a non-permissive license, so we do not vendor its
# binaries.  Users who accept the license can opt in here.
ten-vad = ["numpy>=1.24.0", "onnxruntime>=1.28.0", "ten-vad>=1.0.6.8"]
silero-vad = ["numpy>=1.24.0", "onnxruntime>=1.28.0"]
funasr-vad = [
    "kaldi-native-fbank>=1.22.3",
    "numpy>=1.24.0",
    "onnxruntime>=1.28.0",
]
smart-turn = ["numpy>=1.24.0", "onnxruntime>=1.28.0"]
# Interactive debugger UI.
debugger = [
    "aiohttp>=3.13.3",
]
webrtc = ["aiortc>=1.15.0", "aiohttp>=3.13.3"]
webtransport = ["aioquic>=1.3.0,<2"]
quickstart = [
    "sounddevice>=0.4.6",
    "openai>=2.44.0",
    "openai-agents>=0.18.3",
    "numpy>=1.24.0",
    "onnxruntime>=1.28.0",
    "livekit>=1.1.13",
]
# ``all`` is the union of every extra EXCEPT three deliberate exclusions:
#   - ten-vad: non-permissive license (binaries not vendored)
#   - pydantic-ai / pydantic-ai-v2: mutually exclusive; see
#     [tool.uv].conflicts below
# tests/test_dependency_policy.py enforces this union invariant.
all = [
    "aioquic>=1.3.0,<2",
    "aiortc>=1.15.0",
    "livekit>=1.1.13",
    "aiohttp>=3.13.3",
    "fastapi>=0.140.0",
    "openai>=2.44.0",
    "openai-agents>=0.18.3",
    "langchain-core>=1.2.28",
    "langgraph>=1.2.9",
    "llama-index-workflows>=2.22.2,<3.0.0",
    "llama-agents-client>=0.3.11,<1.0.0",
    "phonenumberslite>=9.0.35",
    "python-multipart>=0.0.29",
    "sounddevice>=0.4.6",
    "pyrnnoise>=0.3.0",
    "requests>=2.33.0",
    "twilio>=9.0.0",
    "uvicorn>=0.51.0",
    "kaldi-native-fbank>=1.22.3",
    "numpy>=1.24.0",
    "onnxruntime>=1.28.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "*.key",
    "*.pem",
    "*.egg-info",
    "*.egg-info/**",
    ".agents",
    ".agents/**",
    ".claude",
    ".claude/**",
    ".codex",
    ".codex/**",
    ".coverage",
    ".coverage.*",
    ".easycat",
    ".easycat/**",
    ".git",
    ".git/**",
    ".github",
    ".github/**",
    ".hypothesis",
    ".hypothesis/**",
    ".mypy_cache",
    ".mypy_cache/**",
    ".mutmut-cache",
    ".mutmut-cache/**",
    ".pipecat-bench",
    ".pipecat-bench/**",
    ".pytest_cache",
    ".pytest_cache/**",
    ".ruff_cache",
    ".ruff_cache/**",
    ".uv-cache",
    ".uv-cache/**",
    ".venv",
    ".venv/**",
    "build",
    "build/**",
    "coverage.xml",
    "dist",
    "dist/**",
    "docs",
    "docs/**",
    "htmlcov",
    "htmlcov/**",
    "mutants",
    "mutants/**",
    "plan",
    "plan/**",
    "runs",
    "runs/**",
    "site",
    "site/**",
    # Anchored: only the repo-root test suite. Scaffold templates ship a
    # nested ``tests/`` directory that must reach the sdist/wheel.
    "/tests",
    "/tests/**",
]

[tool.uv]
# Local contributors may use compatible patch releases. CI reads the exact
# tool pin from each setup-uv step so lock generation remains reproducible;
# --locked independently rejects dependency drift. Review both deliberately
# before a uv minor-version upgrade.
required-version = ">=0.11.0,<0.13.0"
exclude-newer = "3 days"
conflicts = [
    [
        { extra = "pydantic-ai" },
        { extra = "pydantic-ai-v2" },
    ],
]

[dependency-groups]
docs = [
    # Keep the Pages toolchain explicit and reproducible in uv.lock. These
    # packages have had compatibility-sensitive releases in the past, so bump
    # them deliberately and verify ``uv run --group docs mkdocs build --strict``
    # after each change.
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pygments==2.20.0",
    "pymdown-extensions==11.0.1",
]
dev = [
    "diff-cover>=10.4.1",
    "hypothesis>=6.161.5",
    "import-linter>=2",
    "mutmut>=3.2.3",
    "mypy>=2.3.0",
    # NumPy 2.5+ requires Python 3.12 and uses 3.12-only syntax in its stubs.
    # Keep the dev environment compatible with mypy's Python 3.11 target.
    "numpy<2.5",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 99
target-version = "py311"
required-version = ">=0.16.1"
extend-exclude = ["src/easycat/cli/scaffold/templates"]

[tool.ruff.lint]
# Keep Ruff 0.16+'s curated default rule set and layer repository-specific
# policy on top. Using ``select`` here would replace the defaults entirely.
# C901 (mccabe complexity) and PLR0912/PLR0915 (branch/statement counts) keep
# new code out of the >10-complexity territory the M4 refactor cleaned up in
# the streaming/bridge hot spots.  Existing offenders are enumerated in
# per-file-ignores below — shrink that list, never grow it.
extend-select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "C901",
    "PLR0912",
    "PLR0915",
    "ASYNC",
    "B",
    "RUF006",
    "T201",
    # High-signal extensions beyond Ruff's curated defaults.
    "A001",
    "A003",
    "LOG",
    "PERF203",
    "PERF403",
    "TID251",
]
# ASYNC109 (explicit async timeout params) is deliberate public API here (incl.
# timeouts.py) — permanent.
ignore = ["ASYNC109"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option / typer.Argument defaults are the documented Typer idiom, not B008
# bugs (kills all 19 false positives).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.Task.uncancel" = { msg = "Use easycat._concurrency cancellation accounting instead." }

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Executable teaching material, examples, maintenance scripts, benchmarks,
# and tests intentionally write human-facing output.
"docs/**/*.py" = ["T201"]
"examples/**/*.py" = ["T201"]
"perf/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]
"tests/**/*.py" = ["T201"]
# These production entry points intentionally own terminal output. Library
# modules outside this list must route diagnostics through logging.
"src/easycat/cli/__init__.py" = ["T201"]
"src/easycat/helpers.py" = ["T201"]
"src/easycat/server/webrtc_routes.py" = ["T201"]
"src/easycat/server/websocket.py" = ["T201"]
"src/easycat/server/webtransport.py" = ["T201"]
"src/easycat/validation/runner.py" = ["T201"]
# ── Complexity-lint grandfather list (M4) ─────────────────────────
# Pre-existing C901/PLR0912/PLR0915 offenders at the time the rules were
# enabled.  Fix a file → delete its line.  Do not add new entries.
"docs/teaching/07-tools/blocking_tool.py" = ["C901", "PLR0912"]
