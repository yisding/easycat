# docker compose -f docker/compose.yaml up --build
#
# Requires OPENAI_API_KEY in your shell (or a sibling .env file).

services:
  easycat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: easycat:ws
    container_name: easycat-ws
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your shell or a .env file}
      EASYCAT_WS_HOST: 0.0.0.0
      EASYCAT_WS_TOKEN: ${EASYCAT_WS_TOKEN:?set EASYCAT_WS_TOKEN in your shell or a .env file}
      # Browser-demo opt-in. Safe here because the published host port below
      # is loopback-only; production clients should use Authorization headers.
      EASYCAT_WS_ALLOW_QUERY_TOKEN: "1"
      EASYCAT_WS_MAX_SESSIONS: ${EASYCAT_WS_MAX_SESSIONS:-10}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # Crash-durable journals (EASYCAT_DATA_DIR, default ".easycat") — an
      # ephemeral container filesystem would silently drop the framework's
      # journal-durability guarantee across `docker compose down`/recreate.
      # See "Persisting the journal across restarts" in docs/deployment/docker.md.
      - easycat-journal:/app/.easycat
    restart: unless-stopped
    # Delegates to the image's own HEALTHCHECK (docker/healthcheck.py), which
    # TCP-probes EASYCAT_WS_HOST/EASYCAT_WS_PORT for this raw-websockets
    # example; set EASYCAT_HEALTH_URL instead if you swap the CMD for a
    # VoiceServer-based script that serves /health/ready.
    healthcheck:
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  easycat-journal:
