name: Framework Latency Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "37 11 * * 0"

permissions:
  contents: read

concurrency:
  group: framework-latency-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Normalized framework scheduling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            perf/framework_environments/*/uv.lock
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - name: Run randomized provider-free comparison
        run: >-
          uv run --no-sync --python 3.12
          python perf/bench_framework_latency.py
          --iterations 30
          --warmups 5
          --seed 7
          --output "framework-latency-${GITHUB_SHA}.json"
      - name: Upload dated, revision-stamped samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: framework-latency-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: framework-latency-${{ github.sha }}.json
          if-no-files-found: error
