name: Nightly Validation

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# Minimal default token scope for every job (only checkout needs read).
# Individual jobs override this if they ever need more.
permissions:
  contents: read

jobs:
  # Full serial-equivalent suite across every advertised Python version.
  # PR CI runs the quick slice on the oldest/newest Pythons only (3.12 is
  # covered per-PR by the coverage job), so this matrix is where the
  # intermediate versions get their regular full-suite coverage. The former
  # `quick` nightly job was a strict subset of this one and was removed.
  full-local:
    name: Nightly Full Local (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/nightly/${{ github.job }}-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Run property tests under the thorough Hypothesis profile (500 examples,
      # non-derandomized) on the nightly schedule -- PRs stay on the fast "dev"
      # default. Without this, the "ci" profile registered in
      # tests/_hypothesis_profiles.py is never selected by any workflow.
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - run: mkdir -p "$VALIDATION_ARTIFACTS_DIR"
      - run: uv run --python ${{ matrix.python-version }} pytest -q --junitxml="$VALIDATION_ARTIFACTS_DIR/junit.xml" --junit-prefix "nightly-full-local" -m "not integration_socket and not integration_live and not integration_external and not stress and not serial and not flaky"
      - name: Validate direct-fork tests serially
        run: >-
          uv run --python ${{ matrix.python-version }} pytest -q
          -o faulthandler_timeout=0
          -o timeout=0
          --junitxml="$VALIDATION_ARTIFACTS_DIR/serial-junit.xml"
          --junit-prefix "nightly-serial-py${{ matrix.python-version }}"
          tests/runtime/test_artifacts.py
          tests/runtime/test_crash_sweep.py
          tests/vad/test_silero.py
          -m serial
      - name: Upload full local validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-validation-report-full-local-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VALIDATION_ARTIFACTS_DIR }}
          retention-days: 14

  socket:
    name: Nightly Socket
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/nightly/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --python 3.12 easycat validate socket --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "nightly-socket" --show-output
      - name: Upload socket validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-validation-report-socket-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VALIDATION_ARTIFACTS_DIR }}
          retention-days: 14

  stress:
    name: Nightly Stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/nightly/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --python 3.12 easycat validate stress --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "nightly-stress" --show-output
      - name: Upload stress validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-validation-report-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VALIDATION_ARTIFACTS_DIR }}
          retention-days: 14

  flaky-quarantine:
    name: Flaky Quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      # The stale-`review_by` check already runs at collection time via
      # tests/conftest.py -> validate_flaky_marker, so a past date fails this
      # step. pipefail propagates that error; `|| [ "$?" -eq 5 ]` tolerates
      # pytest's exit-5 ("no flaky tests quarantined"), the healthy state.
      - name: Collect quarantined (flaky) tests
        run: |
          set -o pipefail
          uv run --python 3.12 pytest --collect-only -q -m flaky | tee flaky-quarantine.txt || [ "$?" -eq 5 ]
      - name: Upload flaky quarantine report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flaky-quarantine-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: flaky-quarantine.txt
          retention-days: 14

  # Install-test every optional extra nightly. The matrix is generated from
  # [project.optional-dependencies] by scripts/extras_matrix.py, so a new
  # extra is covered automatically with no workflow edit.
  #
  # Known cells, handled deliberately:
  # - cartesia is an empty marker extra (the provider speaks WebSocket via the
  #   core dependency); its cell still proves the Cartesia adapters import.
  # - funasr-vad uses EasyCat's bundled model plus in-tree runtime
  #   dependencies; its cell catches stale upstream SDK reintroductions.
  # - pydantic-ai and pydantic-ai-v2 are mutually exclusive pins; they
  #   never co-install because each cell syncs exactly one extra into a fresh
  #   environment (uv sync is exact and removes anything not requested).
  # - langchain and langchain-v0 are separate 1.x / 0.3.x lines. Each cell
  #   installs one complete line and runs the same exact bridge contract.
  # - ten-vad is deliberately excluded: its non-permissive license is an
  #   end-user opt-in, and installing it here would have project CI accept
  #   those terms nightly. See EXCLUDED_EXTRAS in scripts/extras_matrix.py.
  extras-plan:
    name: Extras Matrix Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      extras: ${{ steps.plan.outputs.extras }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: python3 scripts/extras_matrix.py | tee -a "$GITHUB_OUTPUT"

  extras-install:
    name: Extras Install (${{ matrix.extra }})
    needs: extras-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRIDGE_EXTRAS_EVIDENCE_DIR: .easycat/validation/nightly/bridge-extras/${{ matrix.extra }}-${{ github.run_id }}-${{ github.run_attempt }}
      TRANSPORT_EXTRAS_EVIDENCE_DIR: .easycat/validation/nightly/transport-extras/${{ matrix.extra }}-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        extra: ${{ fromJSON(needs.extras-plan.outputs.extras) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Select exact bridge contract for this extra
        id: bridge-contract
        env:
          EXTRA_NAME: ${{ matrix.extra }}
        run: python3 scripts/bridge_extras_evidence.py node "$EXTRA_NAME" >> "$GITHUB_OUTPUT"
      - name: Select exact transport backend tests for this extra
        id: transport-contract
        env:
          EXTRA_NAME: ${{ matrix.extra }}
        run: python3 scripts/transport_extras_evidence.py node "$EXTRA_NAME" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - name: Install PortAudio for local-audio extras
        if: contains(fromJSON('["local", "quickstart", "all"]'), matrix.extra)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2
      # matrix.extra comes from scripts/extras_matrix.py (pyproject optional
      # deps), not user input, so the interpolation is safe here.
      - run: uv sync --locked --extra "${{ matrix.extra }}" --group dev --python 3.12 # zizmor: ignore[template-injection]
      # --no-sync everywhere below: a bare `uv run` would re-sync the
      # environment to dev defaults and silently remove the extra under test.
      - name: Import-smoke the synced extra
        # matrix.extra is derived from pyproject (scripts/extras_matrix.py), not
        # attacker-controllable input.
        run: uv run --no-sync --python 3.12 python scripts/extras_smoke.py "${{ matrix.extra }}" # zizmor: ignore[template-injection]
      # The unused requires_extra pytest marker was dropped (it marked zero
      # tests). Extras coverage relies on the import smoke above, the offline
      # contract tests, and exact real-SDK/backend tests selected below for
      # bridge and transport extras.
      - name: Offline contracts and SDK-gated bridge tests
        run: uv run --no-sync --python 3.12 pytest tests/contracts tests/integrations/agents -q -m "not integration_live"
      - name: Run exact optional-SDK bridge contract
        if: always() && steps.bridge-contract.outputs.node != ''
        env:
          CONTRACT_NODE: ${{ steps.bridge-contract.outputs.node }}
          JUNIT_PREFIX: bridge-extra-${{ matrix.extra }}
        run: |
          mkdir -p "$BRIDGE_EXTRAS_EVIDENCE_DIR"
          uv run --no-sync --python 3.12 pytest "$CONTRACT_NODE" -q -m integration_external --junitxml="$BRIDGE_EXTRAS_EVIDENCE_DIR/junit.xml" --junit-prefix "$JUNIT_PREFIX"
      - name: Verify exact candidate SHA and contract result
        if: always() && steps.bridge-contract.outputs.node != ''
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          EXTRA_NAME: ${{ matrix.extra }}
        run: >-
          python3 scripts/bridge_extras_evidence.py report
          --extra "$EXTRA_NAME"
          --expected-sha "$CANDIDATE_SHA"
          --junit "$BRIDGE_EXTRAS_EVIDENCE_DIR/junit.xml"
          --output "$BRIDGE_EXTRAS_EVIDENCE_DIR/evidence.json"
      - name: Upload exact-SHA bridge extras evidence
        if: always() && steps.bridge-contract.outputs.node != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bridge-extras-proof-${{ matrix.extra }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BRIDGE_EXTRAS_EVIDENCE_DIR }}
          retention-days: 30
      - name: Run exact optional-backend transport tests
        if: always() && steps.transport-contract.outputs.node != ''
        env:
          CONTRACT_NODE: ${{ steps.transport-contract.outputs.node }}
          JUNIT_PREFIX: transport-extra-${{ matrix.extra }}
        run: |
          mkdir -p "$TRANSPORT_EXTRAS_EVIDENCE_DIR"
          uv run --no-sync --python 3.12 pytest "$CONTRACT_NODE" -q --junitxml="$TRANSPORT_EXTRAS_EVIDENCE_DIR/junit.xml" --junit-prefix "$JUNIT_PREFIX"
      - name: Verify exact candidate SHA and transport backend result
        if: always() && steps.transport-contract.outputs.node != ''
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          EXTRA_NAME: ${{ matrix.extra }}
        run: >-
          python3 scripts/transport_extras_evidence.py report
          --extra "$EXTRA_NAME"
          --expected-sha "$CANDIDATE_SHA"
          --junit "$TRANSPORT_EXTRAS_EVIDENCE_DIR/junit.xml"
          --output "$TRANSPORT_EXTRAS_EVIDENCE_DIR/evidence.json"
      - name: Upload exact-SHA transport extras evidence
        if: always() && steps.transport-contract.outputs.node != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: transport-extras-proof-${{ matrix.extra }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TRANSPORT_EXTRAS_EVIDENCE_DIR }}
          retention-days: 30

  live-canaries:
    name: Live Provider Canaries
    if: github.event_name != 'pull_request' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-validation
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/nightly/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - name: Mask live provider secrets
        shell: bash
        run: |
          for value in "${OPENAI_API_KEY:-}" "${DEEPGRAM_API_KEY:-}" "${ELEVENLABS_API_KEY:-}" "${CARTESIA_API_KEY:-}"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done
      # Deepgram/ElevenLabs live probes need their SDK extras installed;
      # OpenAI and Cartesia adapters run on core dependencies alone.
      - run: uv sync --locked --group dev --extra deepgram --extra elevenlabs --python 3.12
      # Non-strict: a provider whose secret is absent records an expected skip
      # instead of failing the canary run.
      #
      # TODO: cassette recording needs live credentials and is intentionally
      # skipped here; the checked-in cassette corpus (tests/cassettes/**) is
      # still all-OpenAI and should diversify to deepgram/elevenlabs/cartesia.
      - name: Run non-strict live provider canaries
        run: uv run --no-sync --python 3.12 easycat validate live --provider openai --provider deepgram --provider elevenlabs --provider cartesia --surface stt --surface tts --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --show-output
      - name: Upload redacted live validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-validation-report-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VALIDATION_ARTIFACTS_DIR }}
          retention-days: 14

  latency:
    name: Nightly Latency
    if: github.event_name != 'pull_request' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: live-validation
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/nightly/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - name: Run latency validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "::add-mask::$OPENAI_API_KEY"
          fi
          uv run --python 3.12 easycat validate latency --require-samples --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --show-output
      - name: Upload latency validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-validation-report-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VALIDATION_ARTIFACTS_DIR }}
          retention-days: 14
