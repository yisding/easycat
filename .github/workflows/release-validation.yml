name: Release Validation

on:
  workflow_dispatch:
  # Reusable entry point so release.yml's tag-triggered `validate` job can run
  # this exact gate (via `uses:`) instead of duplicating the
  # build/twine/clean-install/live steps and letting them drift. The caller
  # passes the provider keys explicitly (declared here, not `secrets: inherit`).
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: false
      DEEPGRAM_API_KEY:
        required: false
      ELEVENLABS_API_KEY:
        required: false
      CARTESIA_API_KEY:
        required: false

# Minimal default token scope for every job (only checkout needs read).
# Individual jobs override this if they ever need more.
permissions:
  contents: read

jobs:
  release-validation:
    name: Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-validation
    env:
      VALIDATION_ARTIFACTS_DIR: ${{ github.workspace }}/.easycat/validation/release/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - name: Mask live provider secrets
        shell: bash
        run: |
          for value in "${OPENAI_API_KEY:-}" "${DEEPGRAM_API_KEY:-}" "${ELEVENLABS_API_KEY:-}" "${CARTESIA_API_KEY:-}"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done
      - run: uv sync --locked --group dev --python 3.12
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_release_tag.py "$RELEASE_TAG"
      - run: uv build --sdist --wheel
      - name: Enforce 13 MiB wheel size budget
        run: python scripts/check_wheel_size.py dist/*.whl
      - name: Check package metadata
        run: uvx twine check dist/*
      - name: Configure release venv path
        # `runner.temp` is not available in a job-level `env:` block (no
        # runner is assigned when job env is evaluated), which made GitHub
        # reject this whole workflow at validation time. Set RELEASE_VENV
        # here, where the runner context exists. Keeping it under
        # $RUNNER_TEMP leaves the venv outside the workspace, which the
        # "Verify installed package outside source tree" step relies on.
        run: echo "RELEASE_VENV=$RUNNER_TEMP/easycat-release-venv" >> "$GITHUB_ENV"
      - name: Create clean install environment
        run: uv venv "$RELEASE_VENV" --python 3.12
      - name: Install built wheel and test tools
        run: |
          WHEEL_PATH="$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' | head -n 1)"
          uv pip install --python "$RELEASE_VENV/bin/python" "easycat[openai,openai-agents] @ file://$WHEEL_PATH"
          # hypothesis is needed at collection time: the quick slice includes
          # unmarked property-based tests (tests/**/*_property.py) that import
          # it at module level, so the wheel-only env must provide it too.
          # pytest-xdist is required because the quick slice runs -n auto.
          uv pip install --python "$RELEASE_VENV/bin/python" pytest pytest-asyncio pytest-xdist hypothesis
      - name: Verify installed package outside source tree
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
        run: |
          "$RELEASE_VENV/bin/python" - <<'PY'
          import pathlib
          import re
          import easycat
          from importlib.metadata import version

          package_path = pathlib.Path(easycat.__file__).resolve()
          workspace = pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"]).resolve()
          print(package_path)
          assert "site-packages" in str(package_path)
          assert not package_path.is_relative_to(workspace)
          section = (
              (workspace / "docs" / "public-api.md")
              .read_text(encoding="utf-8")
              .split("## Top-Level Allowlist", 1)[1]
          )
          documented = tuple(re.findall(r"^- `([^`]+)`", section, flags=re.MULTILINE))
          assert documented
          assert set(documented) == set(easycat.__all__)
          assert easycat.__version__ == version("easycat")
          for name in documented:
              getattr(easycat, name)
          PY
      - name: Run installed wheel smoke tests
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
        run: |
          "$RELEASE_VENV/bin/easycat" --help
          "$RELEASE_VENV/bin/python" -m easycat
          "$RELEASE_VENV/bin/easycat" init "$RUNNER_TEMP/easycat-scaffold-smoke" --template text-chat --no-git --json
          "$RELEASE_VENV/bin/easycat" doctor --json
          "$RELEASE_VENV/bin/python" -m pytest "$GITHUB_WORKSPACE/tests/cli/test_app.py" -q
      - name: DX3 - generated app smoke, ambient credential, no provider traffic
        # Release-time peer of ci.yml's `generated-app-smoke` job (push + PR):
        # this venv already has the agent SDK installed (see above), so the
        # marginal cost of proving A2/A3 here too is a few seconds. It fires
        # on workflow_dispatch and on a release tag via release.yml -- never
        # on a PR; the continuous proof is the ci.yml job.
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
        run: |
          "$RELEASE_VENV/bin/easycat" init "$RUNNER_TEMP/easycat-app-smoke" \
            --template openai-agents --no-git --json
          cd "$RUNNER_TEMP/easycat-app-smoke"
          # Capture stderr and grep the guard's own marker: a bare "the
          # connection failed" check cannot tell an active guard from an
          # egress-restricted runner or a DNS failure, and would then let the
          # run below proceed believing traffic is blocked when it is not.
          # The marker string is pinned against tests/_netguard/sitecustomize.py
          # by test_netguard_marker_string_matches_the_shared_file.
          if PYTHONPATH="$GITHUB_WORKSPACE/tests/_netguard" "$RELEASE_VENV/bin/python" \
              -c "import socket; socket.create_connection(('api.openai.com', 443), timeout=5)" \
              2>"$RUNNER_TEMP/guard.err"; then
            echo "network guard did not block outbound traffic"; exit 1
          fi
          grep -q "easycat test guard: outbound network blocked" "$RUNNER_TEMP/guard.err"
          OPENAI_API_KEY="sk-ambient-not-used" \
          PYTHONPATH="$GITHUB_WORKSPACE/tests/_netguard" \
            "$RELEASE_VENV/bin/python" -m pytest tests -q -p no:cacheprovider
          python - <<'PY'
          import pathlib
          p = pathlib.Path("tools.py")
          t = p.read_text()
          assert '"%H:%M"' in t, "seeded-break target moved; update this step"
          p.write_text(t.replace('"%H:%M"', '"%H hours"'))
          PY
          if "$RELEASE_VENV/bin/python" -m pytest tests -q -p no:cacheprovider; then
            echo "generated tests did not detect a broken app"; exit 1
          fi
      - name: Run installed wheel quick validation
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
          EASYCAT_VALIDATION_PYTEST_COMMAND: ${{ env.RELEASE_VENV }}/bin/python -m pytest
          EASYCAT_VALIDATION_TEST_PATHS: ${{ github.workspace }}/tests
        run: |
          "$RELEASE_VENV/bin/easycat" validate quick --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "release-quick" --show-output
      - name: Run installed wheel stress validation
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
          EASYCAT_VALIDATION_PYTEST_COMMAND: ${{ env.RELEASE_VENV }}/bin/python -m pytest
          EASYCAT_VALIDATION_TEST_PATHS: ${{ github.workspace }}/tests
        run: |
          "$RELEASE_VENV/bin/easycat" validate stress --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "release-stress" --show-output
      - name: Release flaky quarantine collection
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
        run: |
          "$RELEASE_VENV/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" --collect-only -q -m flaky
      - name: Strict release live validation
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
          EASYCAT_VALIDATION_PYTEST_COMMAND: ${{ env.RELEASE_VENV }}/bin/python -m pytest
          EASYCAT_VALIDATION_TEST_ROOT: ${{ github.workspace }}/tests
        run: |
          "$RELEASE_VENV/bin/easycat" validate live --release --provider openai --surface stt --surface tts --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --show-output
      - name: Release latency sweep
        if: env.OPENAI_API_KEY != ''
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
          EASYCAT_VALIDATION_PYTEST_COMMAND: ${{ env.RELEASE_VENV }}/bin/python -m pytest
          EASYCAT_VALIDATION_TEST_ROOT: ${{ github.workspace }}/tests
        run: |
          "$RELEASE_VENV/bin/easycat" validate latency --sweep --require-samples --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --show-output
      - name: Verify release validation reports
        run: |
          uv run --python 3.12 python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ["VALIDATION_ARTIFACTS_DIR"])
          reports = sorted(root.glob("runs/*/report.json"))
          if not reports:
              raise SystemExit("no release validation reports found")
          unexpected = []
          for report_path in reports:
              payload = json.loads(report_path.read_text())
              for skip in payload.get("skips", []):
                  if not skip.get("expected", False):
                      unexpected.append(f"{report_path}: {skip.get('name')}")
          if unexpected:
              raise SystemExit("unexpected release validation skips: " + ", ".join(unexpected))
          sys.exit(0)
          PY
      - name: Upload release validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-validation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}
            dist/**
          retention-days: 30
