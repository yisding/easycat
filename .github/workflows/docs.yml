name: Deploy docs site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".mkdocs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/regen_teaching_chapters.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize Pages deploys so overlapping main pushes don't race each other.
# Matches the official actions/deploy-pages template.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Always build (on push, on matching PR, on manual trigger) so we catch
    # mkdocs / hook regressions before they land on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - name: Sync docs and teaching dependencies
        run: uv sync --locked --no-default-groups --group docs --extra quickstart --python 3.12
      - name: Check chapter auto-blocks are in sync with source
        # `scripts/regen_teaching_chapters.py` refreshes the auto:snippet /
        # auto:diff / auto:linerange / auto:linkhash blocks in each chapter
        # README from the chapter's `*.py`. If a contributor edits a
        # chapter's source without re-running the script, the README drifts
        # silently (deep links point at the wrong lines, snippets show the
        # old code). `--check` exits non-zero with a diff on stderr.
        run: uv run --no-sync python scripts/regen_teaching_chapters.py --check
      - name: Build the site (--strict)
        run: uv run --no-sync mkdocs build --strict
      - name: Import-check teaching scripts not covered by pytest
        # `naive_threshold.py`, `blocking_tool.py`, `wrong_order.py` and the
        # other teaching scripts aren't collected by pytest (they live under
        # docs/teaching/, outside testpaths). If easycat moves a symbol they
        # import, the rot is silent. Compile every .py under docs/teaching/
        # in the same environment as the runtime tests, with the source
        # tree on PYTHONPATH so cross-imports resolve.
        run: |
          set -eu
          PYTHONPATH=src uv run --no-sync python -m compileall -q docs/teaching/
          find docs/teaching -name '*.py' -print0 | while IFS= read -r -d '' f; do
            uv run --no-sync python -c "import ast; ast.parse(open('$f').read())"
          done
          # Spot-check the three wrong-version-first scripts compile *and*
          # their easycat imports resolve.
          uv run --no-sync python -c "
          import importlib.util, sys
          for path in [
              'docs/teaching/04-vad-preroll/naive_threshold.py',
              'docs/teaching/07-tools/blocking_tool.py',
              'docs/teaching/10-cleaning-signal/wrong_order.py',
          ]:
              spec = importlib.util.spec_from_file_location('m', path)
              mod = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(mod)
              except SystemExit:
                  pass  # main() raises SystemExit when env vars missing
              except ImportError as e:
                  sys.exit(f'{path}: import failed: {e}')
          print('All teaching scripts import cleanly.')
          "

      - name: Smoke-check the hook output
        # The hook in .mkdocs/hooks.py aliases each README.md to the
        # directory's index URL. If the hook silently breaks (mkdocs
        # File API changes, plugin order shifts), the build still succeeds
        # but URLs become /teaching/00-hello-audio/README/ instead of
        # /teaching/00-hello-audio/. These assertions catch that, and that
        # the Reference pages keep building alongside the teaching ladder.
        run: |
          set -eu
          test -f site/index.html
          test -f site/teaching/index.html
          test -f site/teaching/00-hello-audio/index.html
          test -f site/teaching/15-operate-in-production/index.html
          test ! -f site/teaching/00-hello-audio/README/index.html
          test -f site/architecture/index.html
          test -f site/reference/events/index.html
          test -f site/reference/easyconfig/index.html
          test -f site/reference/session-lifecycle/index.html

      # actions/upload-pages-artifact v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  configure-pages:
    # Keep Pages/OIDC permissions out of the PR-triggered build job. This
    # push-main-only job flips the repo Pages source to GitHub Actions on the
    # first deploy so actions/deploy-pages doesn't fail against the legacy
    # gh-pages source. `enablement: true` is a no-op once Pages is already
    # Actions-backed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    steps:
      # actions/configure-pages v6
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, configure-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v5.0.0
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: deployment
