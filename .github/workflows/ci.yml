name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimal default token scope for every job (only checkout needs read).
# Individual jobs override this if they ever need more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Enforce the package layering contracts ([tool.importlinter] in
      # pyproject.toml): provider-family independence + the webrtc forbidden edge.
      - run: uv run lint-imports
      # Static analysis of the workflows themselves: SHA-pinned actions,
      # persist-credentials, template-injection, etc. Pinned so a new zizmor
      # release cannot change or fail this job without a repo change; keep in
      # sync with the zizmor-pre-commit rev in .pre-commit-config.yaml.
      - run: uvx zizmor==1.26.1 .github/workflows

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        env:
          # ruff is already covered by the dedicated `lint` job above.
          SKIP: ruff-check,ruff-format
        run: uv run pre-commit run --all-files --show-diff-on-failure

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - run: uv sync --locked --group dev --python 3.12
      # Advisory: full-repo type report. Never fails the build today
      # (~72 known errors across optional providers / config / cli /
      # debugger); surfaces the count so we can ratchet it down over time.
      - name: mypy (advisory, whole repo)
        continue-on-error: true
        run: uv run --python 3.12 mypy src/easycat
      # Gate: the clean core must stay green. The gated path list lives in
      # the justfile (`mypy_gated_paths`) so local `just typecheck` and CI
      # grade exactly the same packages.
      - name: mypy (gate, clean core)
        run: just typecheck

  test:
    name: Validate Quick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} easycat validate quick --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "quick-py${{ matrix.python-version }}" --show-output
      - name: Upload quick validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validation-report-quick-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log

  coverage:
    name: Coverage (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0  # diff-cover needs origin/main history
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      # pytest --cov (NOT `coverage run -m pytest -n auto`, which reports 0%
      # under xdist). Safe slice mirrors `easycat validate quick` exactly.
      - name: Run safe slice with coverage
        run: >-
          uv run --python 3.12 pytest -q
          -m "not integration_socket and not integration_live and not integration_external and not contract and not slow and not stress and not flaky"
          --cov --cov-report=term-missing --cov-report=xml:coverage.xml
      # Report-only: PRs see how much of the changed lines they cover.
      # Does NOT fail the build yet (see opt-in --fail-under below).
      - name: Diff coverage vs main
        if: github.event_name == 'pull_request'
        # Pass github.base_ref through env instead of interpolating it directly
        # into the shell command, so a crafted branch name cannot inject code
        # (zizmor template-injection).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          uv run --python 3.12 diff-cover coverage.xml
          --compare-branch="origin/$BASE_REF"
          --markdown-report=diff-cover.md || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            diff-cover.md

  integration-socket:
    name: Validate Socket
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --python 3.12 easycat validate socket --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "socket-py3.12" --show-output
      - name: Upload socket validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validation-report-socket-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/webrtc/stats.jsonl

  contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --python 3.12 easycat validate contracts --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "contracts-py3.12" --show-output
      - name: Upload contract validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validation-report-contracts-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log

  build-smoke:
    name: Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv build
      - run: uvx twine check dist/*
