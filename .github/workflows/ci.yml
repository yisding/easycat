name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimal default token scope for every job (only checkout needs read).
# Individual jobs override this if they ever need more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single lint gate: pre-commit runs every hook — ruff check/format,
  # Import Linter layering contracts, check-yaml, whitespace hygiene,
  # codespell, actionlint, and zizmor (workflow static analysis) — so CI,
  # the local pre-commit hook, and `just pre-commit` all grade the exact
  # same surface with no duplicated jobs.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit (all hooks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b  # v3.1.0
      - run: uv sync --locked --group dev --python 3.12
      # Gate: the whole package at zero errors (vendored vad/_funasr_runtime
      # excluded, stricter checks layered on the core packages — see the
      # [[tool.mypy.overrides]] tables in pyproject.toml). `just typecheck`
      # keeps local runs and CI grading the exact same surface.
      - name: mypy (gate, whole repo)
        run: just typecheck

  test:
    name: Validate Quick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs run the oldest and newest supported Pythons; 3.12 is covered
        # per-PR by the coverage job below, and nightly-validation.yml runs
        # the full-local suite across every advertised version.
        python-version: ["3.11", "3.14"]
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} easycat validate quick --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "quick-py${{ matrix.python-version }}" --show-output
      - name: Upload quick validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validation-report-quick-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log

  coverage:
    name: Coverage (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0  # diff-cover needs origin/main history
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      # pytest --cov (NOT `coverage run -m pytest -n auto`, which reports 0%
      # under xdist; pytest-cov itself is xdist-safe). Mirrors `just cov` and
      # the `easycat validate quick` slice, so this job doubles as the per-PR
      # Python 3.12 test signal.
      - name: Run safe slice with coverage
        run: >-
          uv run --python 3.12 pytest -q -n auto --dist loadscope
          -m "not integration_socket and not integration_live and not integration_external and not contract and not slow and not stress and not flaky"
          --cov --cov-report=term-missing --cov-report=xml:coverage.xml
      # Report-only: PRs see how much of the changed lines they cover.
      # Does NOT fail the build yet (see opt-in --fail-under below).
      - name: Diff coverage vs main
        if: github.event_name == 'pull_request'
        # Pass github.base_ref through env instead of interpolating it directly
        # into the shell command, so a crafted branch name cannot inject code
        # (zizmor template-injection).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          uv run --python 3.12 diff-cover coverage.xml
          --compare-branch="origin/$BASE_REF"
          --markdown-report=diff-cover.md || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            diff-cover.md

  integration-socket:
    name: Validate Socket
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --python 3.12 easycat validate socket --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "socket-py3.12" --show-output
      - name: Upload socket validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validation-report-socket-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/webrtc/stats.jsonl

  contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --python 3.12 easycat validate contracts --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "contracts-py3.12" --show-output
      - name: Upload contract validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validation-report-contracts-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log

  build-smoke:
    name: Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      # No project sync: `uv build` resolves the build backend in its own
      # isolated environment and twine runs via uvx.
      - run: uv build
      - run: uvx twine check dist/*
