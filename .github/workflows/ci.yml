name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimal default token scope for every job (only checkout needs read).
# Individual jobs override this if they ever need more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single lint gate: pre-commit runs every hook — ruff check/format,
  # Import Linter layering contracts, check-yaml, whitespace hygiene,
  # codespell, actionlint, and zizmor (workflow static analysis) — so CI,
  # the local pre-commit hook, and `just pre-commit` all grade the exact
  # same surface with no duplicated jobs.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit (all hooks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - run: uv sync --locked --group dev --python 3.12
      # Gate: the whole package at zero errors (vendored vad/_funasr_runtime
      # excluded, stricter checks layered on the core packages — see the
      # [[tool.mypy.overrides]] tables in pyproject.toml). `just typecheck`
      # keeps local runs and CI grading the exact same surface.
      - name: mypy (gate, whole package)
        run: just typecheck
      # Consumer snippets exercise overloads and public typing from a clean
      # downstream graph. Keep their one cold mypy process serial instead of
      # repeating it inside every Python/coverage/minimum-dependency xdist job.
      - name: Downstream type contracts
        run: uv run --python 3.12 pytest -q tests/typecheck/test_consumer_contracts.py

  test:
    name: Validate Quick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs run the oldest and newest supported Pythons; 3.12 is covered
        # per-PR by the coverage job below, and nightly-validation.yml runs
        # the full-local suite across every advertised version.
        python-version: ["3.11", "3.14"]
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} easycat validate quick --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "quick-py${{ matrix.python-version }}" --show-output
      - name: Validate direct-fork tests serially
        run: >-
          uv run --python ${{ matrix.python-version }} pytest -q
          -o faulthandler_timeout=0
          -o timeout=0
          --junitxml="$VALIDATION_ARTIFACTS_DIR/serial-junit.xml"
          --junit-prefix "serial-py${{ matrix.python-version }}"
          tests/runtime/test_artifacts.py
          tests/runtime/test_crash_sweep.py
          tests/vad/test_silero.py
          -m serial
      - name: Upload quick validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validation-report-quick-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/serial-junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log

  minimum-dependencies:
    name: Minimum Direct Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep this job's nested `uv run pytest` inside the environment resolved
      # below instead of switching back to the default resolution strategy.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      # Changing the resolution mode makes uv resolve a fresh minimum-direct
      # lock instead of reusing the committed highest-compatible lock.
      - run: >-
          uv sync --resolution lowest-direct --upgrade --group dev
          --extra langchain --extra telephony --python 3.12
      - run: uv run --no-sync --python 3.12 easycat validate quick --show-output
      # The universal project lock must satisfy unselected extras too, so
      # LangGraph and OpenAI Agents can raise the effective LangChain/HTTPX
      # versions. Exercise the downstream package floors explicitly as well.
      - name: Install exact downstream compatibility floors
        run: >-
          uv pip install --python .venv/bin/python
          "aiohttp==3.13.3" "httpx==0.27.0" "langchain-core==1.5.3"
          "rich==13.8.0" "typer==0.27.1" "websockets==14.0"
      - name: Assert exact direct dependency floors
        run: >-
          .venv/bin/python -c
          'from importlib.metadata import version;
          expected={"aiohttp":"3.13.3","httpx":"0.27.0","langchain-core":"1.5.3",
          "rich":"13.8.0","typer":"0.27.1","websockets":"14.0"};
          actual={name:version(name) for name in expected};
          assert actual == expected, actual'
      - name: Test exact downstream compatibility floors
        run: >-
          .venv/bin/python -m pytest -q
          tests/integrations/agents/test_langchain_bridge_history_store.py
          tests/integrations/agents/test_langchain_bridge_stream_config.py
          tests/integrations/agents/test_langchain_bridge_interruption.py
          tests/integrations/agents/test_langchain_bridge_invoke.py
          tests/transports/test_websocket_transport.py
          tests/websocket/test_reconnecting_ws.py
          tests/stt/test_stt_openai.py
          tests/tts/test_tts_openai.py
          tests/server/test_webrtc_routes.py

  coverage:
    name: Coverage + guard suite (diff-cover report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # diff-cover needs origin/main history
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      # pytest --cov (NOT `coverage run -m pytest -n auto`, which reports 0%
      # under xdist; pytest-cov itself is xdist-safe). Uses the `just cov`
      # marker slice but deliberately KEEPS the `guard` docs/prose tests (which
      # `just cov`/`just test-fast`/`validate quick` skip for the fast loop) so
      # this per-PR Python 3.12 job is the PR signal for the guard suite too.
      - name: Run safe slice with coverage
        run: >-
          uv run --python 3.12 pytest -q -n auto --dist load
          -m "not integration_socket and not integration_live and not integration_external and not contract and not latency and not slow and not stress and not serial and not flaky"
          --cov --cov-report=term-missing --cov-report=xml:coverage.xml
      # Report-only: PRs see how much of the changed lines they cover.
      # Does NOT fail the build yet (see opt-in --fail-under below).
      - name: Diff coverage vs main
        if: github.event_name == 'pull_request'
        # Pass github.base_ref through env instead of interpolating it directly
        # into the shell command, so a crafted branch name cannot inject code
        # (zizmor template-injection).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          uv run --python 3.12 diff-cover coverage.xml
          --compare-branch="origin/$BASE_REF"
          --markdown-report=diff-cover.md || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            diff-cover.md

  integration-socket:
    name: Validate Socket
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --python 3.12 easycat validate socket --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "socket-py3.12" --show-output
      - name: Upload socket validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validation-report-socket-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/webrtc/stats.jsonl

  contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATION_ARTIFACTS_DIR: .easycat/validation/ci/${{ github.job }}-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --python 3.12 easycat validate contracts --artifacts-dir "$VALIDATION_ARTIFACTS_DIR" --junit-prefix "contracts-py3.12" --show-output
      - name: Upload contract validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validation-report-contracts-py3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/latest.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/report.json
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/junit.xml
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stdout.log
            ${{ env.VALIDATION_ARTIFACTS_DIR }}/runs/**/stderr.log

  build-smoke:
    name: Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"
      # No project sync: `uv build` resolves the build backend in its own
      # isolated environment and twine runs via uvx.
      - run: uv build
      - name: Enforce 13 MiB wheel size budget
        run: python scripts/check_wheel_size.py dist/*.whl
      - run: uvx twine check dist/*
