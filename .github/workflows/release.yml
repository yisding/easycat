name: Release

# Tag-triggered publish to PyPI via Trusted Publishing (OIDC, no stored token).
# Three-job graph: validate -> build -> publish. Only `publish` is privileged
# (`id-token: write`) and is gated behind the `pypi` environment's required
# reviewers, so the short-lived OIDC token is never minted until a human
# approves the deployment.
on:
  push:
    tags:
      - "v*"

# Minimal default token scope for every job (only checkout needs read). The
# privileged `publish` job narrowly overrides this with `id-token: write` for
# the OIDC exchange; no other job needs more.
permissions:
  contents: read

jobs:
  # Reuse the full release gate (build + twine check + clean out-of-tree wheel
  # install + smoke + strict live/latency validation) so the tag path cannot
  # drift from the manually dispatchable gate. `secrets: inherit` passes the
  # live provider keys the gate reads; the reusable workflow keeps its own
  # `release-validation` environment and minimal `contents: read` scope.
  validate:
    uses: ./.github/workflows/release-validation.yml
    # Pass only the four provider keys the gate reads, explicitly (not
    # `secrets: inherit`, which would hand the reusable workflow every repo
    # secret). No PyPI credential is passed — publishing is tokenless via OIDC.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}

  # Build the distributions once, unprivileged (no `id-token` here), and hand
  # them to the publish job as a short-lived artifact. Keeping the build out of
  # the OIDC job means the credential is only ever exchanged after a human
  # approves the `pypi` environment.
  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          # No cache on the release build: it runs once per tag, so the cache
          # saves little, and an enabled cache in a publishing workflow is a
          # cache-poisoning vector (zizmor cache-poisoning).
          enable-cache: false
          python-version: "3.12"
      - run: uv build --sdist --wheel
      - name: Enforce 13 MiB wheel size budget
        run: python scripts/check_wheel_size.py dist/*.whl
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/**
          # Short-lived hand-off to the publish job only; not a durable release
          # artifact (PyPI is the durable store).
          retention-days: 1
          if-no-files-found: error

  # The only privileged job. Publishes to PyPI via Trusted Publishing: the
  # `pypi` environment's required-reviewer gate must approve before the
  # short-lived OIDC token is minted, and `pypa/gh-action-pypi-publish`
  # exchanges it at upload time. No long-lived PYPI_* token is stored anywhere.
  # PEP 740 attestations stay at their (enabled) default.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required-reviewer approval gate configured on the GitHub environment.
    environment: pypi
    # `id-token: write` ONLY — the narrowest scope that lets the OIDC exchange
    # work. Do not also grant `contents: write` etc.; a broader token widens
    # the blast radius of the one privileged job.
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      # pypa/gh-action-pypi-publish v1.14.0 — pinned to a full 40-char commit
      # SHA (not the mutable @release/v1 tag), mirroring docs.yml's privileged
      # deploy-pages pin. Trusted Publishing supplies the credential via OIDC,
      # so there is deliberately no `password:` input.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
