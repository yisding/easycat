# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Let a freshly published release soak before Dependabot opens a PR, so a
    # compromised/yanked version does not land the day it ships.
    cooldown:
      default-days: 7
    # Group this ecosystem's weekly bumps instead of opening one PR per package.
    # Split by risk: safe minor/patch upgrades land together in one easy-to-merge
    # PR, while potentially breaking majors are isolated in their own reviewable
    # PR so a risky major never blocks the safe batch.
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      uv-major:
        patterns:
          - "*"
        update-types:
          - "major"
  # Keep the SHA-pinned GitHub Actions current. Dependabot bumps the pin and
  # rewrites the trailing `# vX.Y.Z` comment, so pins never silently rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
  # Docs toolchain (requirements-docs.txt, hash-pinned). Best-effort: if the
  # first PR cannot regenerate `--require-hashes` cleanly, drop this block.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      pip-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # The pip ecosystem also parses pyproject.toml, where the `pydantic-ai`
    # extra is deliberately capped at the v1 line (`pydantic-ai-v2` covers 2.x).
    # Left alone, pip re-proposes widening that cap to <3.0.0 (see closed #397)
    # and edits pyproject.toml without regenerating uv.lock, breaking CI. The
    # uv ecosystem is the real owner of pyproject.toml/uv.lock and respects the
    # cap, so keep pip off pydantic-ai major bumps.
    ignore:
      - dependency-name: "pydantic-ai"
        update-types: ["version-update:semver-major"]
