version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Let a freshly published release soak before Dependabot opens a PR, so a
    # compromised/yanked version does not land the day it ships. Patch releases
    # soak briefly, minors a week, majors two weeks.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Group this ecosystem's weekly bumps instead of opening one PR per package.
    # Split by risk: safe minor/patch upgrades land together in one easy-to-merge
    # PR, while potentially breaking majors are isolated in their own reviewable
    # PR so a risky major never blocks the safe batch.
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      uv-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # Both compatibility extras use the same PyPI distribution. Dependabot
    # cannot address one occurrence independently, so keep the v1 extra on its
    # documented compatibility line until its dated removal window.
    ignore:
      - dependency-name: "pydantic-ai"
        update-types: ["version-update:semver-major"]
  # Keep the SHA-pinned GitHub Actions current. Dependabot bumps the pin and
  # rewrites the trailing `# vX.Y.Z` comment, so pins never silently rot.
  # Note: github-actions ecosystem supports only default-days for cooldown.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
  # Keep immutable Docker base-image digests current without making builds
  # depend on whatever a mutable tag happens to resolve to on that day.
  # Note: docker ecosystem supports only default-days for cooldown.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
