# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Let a freshly published release soak before Dependabot opens a PR, so a
    # compromised/yanked version does not land the day it ships.
    cooldown:
      default-days: 7
    # Group this ecosystem's weekly bumps instead of opening one PR per package.
    # Split by risk: safe minor/patch upgrades land together in one easy-to-merge
    # PR, while potentially breaking majors are isolated in their own reviewable
    # PR so a risky major never blocks the safe batch.
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      uv-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # Both compatibility extras use the same PyPI distribution. Dependabot
    # cannot address one occurrence independently, so keep the v1 extra on its
    # documented compatibility line until its dated removal window.
    ignore:
      - dependency-name: "pydantic-ai"
        update-types: ["version-update:semver-major"]
  # Keep the SHA-pinned GitHub Actions current. Dependabot bumps the pin and
  # rewrites the trailing `# vX.Y.Z` comment, so pins never silently rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
  # Keep immutable Docker base-image digests current without making builds
  # depend on whatever a mutable tag happens to resolve to on that day.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
