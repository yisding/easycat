[project]
name = "$PYPROJECT_NAME"
version = "0.1.0"
description = "Custom EasyCat provider package with a conformance test."
requires-python = ">=3.11"
dependencies = [
    "easycat[$EXTRAS]>=$EASYCAT_VERSION_FLOOR",
]

[project.entry-points."easycat.vad_providers"]
energy = "custom_vad:register"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["custom_vad"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.easycat.scaffold]
template = "$TEMPLATE"
required_env = $REQUIRED_ENV
optional_env = $OPTIONAL_ENV
$EASYCAT_SOURCES_BLOCK
