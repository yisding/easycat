site_name: EasyCat
site_description: >-
  Learn voice pipelines from scratch with the 16-chapter teaching ladder,
  then look up the production API in the reference docs.
site_url: https://yisding.github.io/easycat/
repo_url: https://github.com/yisding/easycat
repo_name: yisding/easycat
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      # The `!!python/name:` tag below requires MkDocs's default YAML
      # loader (UnsafeLoader). This is intentional — pymdown-extensions
      # ships its Mermaid fence formatter as a callable that must be
      # resolved at load time. Don't switch this file to SafeLoader.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets

plugins:
  - search

hooks:
  - .mkdocs/hooks.py

validation:
  nav:
    omitted_files: warn

nav:
  - Home: README.md
  - Learn:
      - Feature ladder:
          - Overview: using-easycat/README.md
          - Chapter 0 — Your First VoiceApp:
              - using-easycat/00-first-voice-app/README.md
              - Exercises: using-easycat/00-first-voice-app/EXERCISES.md
          - Chapter 1 — Run It Anywhere:
              - using-easycat/01-runtime-modes/README.md
              - Exercises: using-easycat/01-runtime-modes/EXERCISES.md
          - Chapter 2 — Pick Providers and Voices:
              - using-easycat/02-providers-and-voices/README.md
              - Exercises: using-easycat/02-providers-and-voices/EXERCISES.md
          - Chapter 3 — Shape the Conversation:
