site_name: EasyCat
site_description: >-
  Learn voice pipelines from scratch with the 16-chapter teaching ladder,
  then look up the production API in the reference docs.
site_url: https://yisding.github.io/easycat/
repo_url: https://github.com/yisding/easycat
repo_name: yisding/easycat
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      # The `!!python/name:` tag below requires MkDocs's default YAML
      # loader (UnsafeLoader). This is intentional — pymdown-extensions
      # ships its Mermaid fence formatter as a callable that must be
      # resolved at load time. Don't switch this file to SafeLoader.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets

plugins:
  - search

hooks:
  - .mkdocs/hooks.py

nav:
  - Home: README.md
  - Learn:
      - Teaching ladder: teaching/README.md
      - Build — assemble the pipeline:
          - Chapter 0 — Hello, Audio:
              - teaching/00-hello-audio/README.md
              - Exercises: teaching/00-hello-audio/EXERCISES.md
          - Chapter 1 — Echo:
              - teaching/01-echo/README.md
              - Exercises: teaching/01-echo/EXERCISES.md
          - Chapter 2 — Transcribe:
              - teaching/02-transcribe/README.md
              - Exercises: teaching/02-transcribe/EXERCISES.md
          - Chapter 3 — Parrot, the naive way:
              - teaching/03-parrot-naive/README.md
              - Exercises: teaching/03-parrot-naive/EXERCISES.md
          - Chapter 4 — VAD + pre-roll:
              - teaching/04-vad-preroll/README.md
              - Exercises: teaching/04-vad-preroll/EXERCISES.md
          - Chapter 5 — The blocking agent:
              - teaching/05-blocking-agent/README.md
              - Exercises: teaching/05-blocking-agent/EXERCISES.md
          - Chapter 6 — Streaming agent + sentence TTS:
              - teaching/06-streaming-agent/README.md
              - Exercises: teaching/06-streaming-agent/EXERCISES.md
          - Chapter 7 — Tools, mid-stream:
              - teaching/07-tools/README.md
              - Exercises: teaching/07-tools/EXERCISES.md
          - Chapter 8 — Smart-turn:
              - teaching/08-smart-turn/README.md
              - Exercises: teaching/08-smart-turn/EXERCISES.md
          - Chapter 9 — Interruption / barge-in:
              - teaching/09-interruption/README.md
              - Exercises: teaching/09-interruption/EXERCISES.md
      - Operate — the demo-to-production gap:
          - Chapter 10 — Cleaning the signal:
              - teaching/10-cleaning-signal/README.md
              - Exercises: teaching/10-cleaning-signal/EXERCISES.md
          - Chapter 11 — The journal as mental model:
              - teaching/11-journal/README.md
              - Exercises: teaching/11-journal/EXERCISES.md
              - Solutions (spoiler): teaching/11-journal/solutions.md
          - Chapter 12 — Evals + the latency budget:
              - teaching/12-evals-and-latency/README.md
              - Exercises: teaching/12-evals-and-latency/EXERCISES.md
      - Generalise — the Protocol payoff:
          - Chapter 13 — Swap providers and transports:
              - teaching/13-swap-providers-and-transports/README.md
              - Exercises: teaching/13-swap-providers-and-transports/EXERCISES.md
          - Chapter 14 — Bring your own agent:
              - teaching/14-bring-your-own-agent/README.md
              - Exercises: teaching/14-bring-your-own-agent/EXERCISES.md
      - Ship — from demo to production:
          - Chapter 15 — Operate in production:
              - teaching/15-operate-in-production/README.md
              - Exercises: teaching/15-operate-in-production/EXERCISES.md
      - From EasyConfig to Session: from-easyconfig-to-session.md
      - Testing and evals: testing-and-evals.md
  - Reference:
      - Architecture: architecture.md
      - Events: reference/events.md
      - EasyConfig fields: reference/easyconfig.md
      - Session lifecycle: reference/session-lifecycle.md
      - Public API contract: public-api.md
      - Extending providers:
          - extending/README.md
          - STT: extending/stt.md
          - TTS: extending/tts.md
          - VAD: extending/vad.md
          - Transport: extending/transport.md
          - Agent bridge: extending/agent-bridge.md
      - Latency: latency.md
      - Validation workflow: validation.md
      - Observability: observability.md
      - Deployment — Docker: deployment/docker.md
